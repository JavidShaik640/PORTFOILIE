<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }

        header, section, footer {
            padding: 2rem;
            max-width: 1200px;
            margin: auto;
        }

        header {
            background: #f4f4f4;
            text-align: center;
        }

        header img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
        }

        .social-icons a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
            font-size: 1.5rem;
        }

        .projects img {
            width: 100%;
            height: auto;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .projects img:hover {
            transform: scale(1.05);
        }

        form input, form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        form button {
            padding: 10px 20px;
            border: none;
            background: #333;
            color: white;
            border-radius: 5px;
        }

        .dark-mode {
            background: #121212;
            color: white;
        }

        .toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            header, section, footer {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <button class="toggle-btn" onclick="toggleDarkMode()">Toggle Dark Mode</button>

    <header id="home">
        <h1 id="profile-name"></h1>
        <img id="profile-photo" src="" alt="Profile Photo">
        <p id="profile-role"></p>
        <div class="social-icons" id="social-links"></div>
    </header>

    <section id="about">
        <h2>About Me</h2>
        <p id="about-description"></p>
        <p><strong>Education:</strong> <span id="about-education"></span></p>
        <p><strong>Interests:</strong> <span id="about-interests"></span></p>
        <div id="skills"></div>
    </section>

    <section id="projects">
        <h2>Projects</h2>
        <div class="projects" id="projects-container"></div>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <form id="contact-form">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <textarea id="message" placeholder="Your Message" required></textarea>
            <button type="submit">Submit</button>
            <p id="form-msg"></p>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 <span id="footer-name"></span>. All Rights Reserved.</p>
    </footer>

        // Render functions
        function renderProfile() {
            const { name, role, photo, social } = data.profile;
            document.getElementById("profile-name").textContent = name;
            document.getElementById("profile-role").textContent = role;
            document.getElementById("profile-photo").src = photo;
            document.getElementById("footer-name").textContent = name;

            const socialContainer = document.getElementById("social-links");
            social.forEach(link => {
                const a = document.createElement("a");
                a.href = link.url;
                a.target = "_blank";
                a.innerHTML = `<i class="${link.icon}"></i>`;
                socialContainer.appendChild(a);
            });
        }

        function renderAbout() {
            const { description, education, interests, skills } = data.about;
            document.getElementById("about-description").textContent = description;
            document.getElementById("about-education").textContent = education;
            document.getElementById("about-interests").textContent = interests;

            const skillContainer = document.getElementById("skills");
            skills.forEach(skill => {
                const skillElement = document.createElement("div");
                skillElement.innerHTML = `<label>${skill.name}</label><progress value="${skill.value}" max="100"></progress>`;
                skillContainer.appendChild(skillElement);
            });
        }

        function renderProjects() {
            const projectContainer = document.getElementById("projects-container");
            data.projects.forEach(project => {
                const div = document.createElement("div");
                div.innerHTML = `
                    <h3>${project.title}</h3>
                    <img src="${project.image}" alt="${project.title}">
                    <p>${project.description}</p>
                `;
                projectContainer.appendChild(div);
            });
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        function validateForm(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();
            const msg = document.getElementById('form-msg');

            if (name && email && message) {
                msg.textContent = "Message sent successfully!";
                msg.style.color = "green";
            } else {
                msg.textContent = "Please fill in all fields correctly.";
                msg.style.color = "red";
            }
        }

        // Initialize everything on load
        document.getElementById("contact-form").addEventListener("submit", validateForm);
        renderProfile();
        renderAbout();
        renderProjects();
    </script>
</body>

</html>
